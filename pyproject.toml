[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-decision-lab"
version = "0.1.0"
description = "Local deterministic capital decision comparison tooling"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
capital = "capital_decision_lab.plugin.commands:main"

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/capital-decision-lab"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["plugins/capital-decision-lab"]
include = ["capital_decision_lab*"]
